name: Mobile reliability checks
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=PRO_PREVIEW=false
      - run: flutter test
  simulator-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --dart-define=APP_ENV=test --dart-define=PRO_PREVIEW=true
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app PhillyScan-Simulator-preview.7.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhillyScan-Simulator-preview.7
          path: mobile/PhillyScan-Simulator-preview.7.zip
          retention-days: 14
