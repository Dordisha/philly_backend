name: Mobile reliability checks
on:
  pull_request:
    paths:
      - 'mobile/**'
      # Server access/data contracts also affect existing mobile flows.
      - 'src/routes/**'
      - 'src/services/paidAccess.js'
      - 'src/services/ownerAccess.js'
      - '.github/workflows/mobile-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=PRO_PREVIEW=false
      - run: flutter test --dart-define=PRO_PREVIEW=true
  simulator-build:
    needs: flutter
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile free records simulator app
        run: flutter build ios --simulator --debug --dart-define=APP_ENV=prod --dart-define=PRO_PREVIEW=false --dart-define=INTERNAL_TESTING=false
      # The owner requested a compiled test app on November 24. This is a
      # build/install/launch smoke check, not the approved #19 acceptance suite.
      - name: Package and launch extracted app on iPhone 17 Pro Max
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          xcodebuild -version > delivery/BUILD-EVIDENCE.txt
          flutter --version >> delivery/BUILD-EVIDENCE.txt
          git rev-parse HEAD >> delivery/BUILD-EVIDENCE.txt
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/ios/iphonesimulator/Runner.app/Info.plist >> delivery/BUILD-EVIDENCE.txt
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/ios/iphonesimulator/Runner.app/Info.plist >> delivery/BUILD-EVIDENCE.txt
          lipo -archs build/ios/iphonesimulator/Runner.app/Runner >> delivery/BUILD-EVIDENCE.txt
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app delivery/PhillyScan-1.1.0-21-Simulator.zip
          unzip -t delivery/PhillyScan-1.1.0-21-Simulator.zip
          clean_dir="$(mktemp -d)"
          ditto -x -k delivery/PhillyScan-1.1.0-21-Simulator.zip "$clean_dir"
          xcrun simctl list runtimes -j > delivery/runtimes.json
          runtime="$(python3 -c 'import json; r=[x for x in json.load(open("delivery/runtimes.json"))["runtimes"] if x.get("isAvailable") and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-26-")]; assert r, "No installed iOS 26 runtime"; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')"
          udid="$(xcrun simctl create PhillyScan-21-Smoke com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")"
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true; xcrun simctl delete "$udid" >/dev/null 2>&1 || true; rm -rf "$clean_dir"' EXIT
          printf 'Device: iPhone 17 Pro Max\nRuntime: %s\n' "$runtime" >> delivery/BUILD-EVIDENCE.txt
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$clean_dir/Runner.app"
          launched="$(xcrun simctl launch "$udid" com.dorian.phillyscan)"
          printf '%s\n' "$launched" >> delivery/BUILD-EVIDENCE.txt
          pid="${launched##*: }"
          sleep 10
          kill -0 "$pid"
          xcrun simctl io "$udid" screenshot delivery/launch.png
          printf 'Extracted ZIP installed; process alive after 10 seconds; screenshot captured.\nNot full native acceptance or production verification.\n' >> delivery/BUILD-EVIDENCE.txt
      - name: Save simulator app and smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: PhillyScan-1.1.0-21-Simulator
          path: mobile/delivery/
          retention-days: 14
          if-no-files-found: error
