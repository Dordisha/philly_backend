name: Pro purchase candidate
on:
  push:
    branches: ['build/pro-purchase-candidate-16']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile purchase candidate
        run: flutter build ios --simulator --debug --build-name=1.1.0 --build-number=16 --dart-define-from-file=release-settings.json --dart-define=APP_ENV=prod --dart-define=PRO_PREVIEW=false --dart-define=INTERNAL_TESTING=false
      - name: Package simulator application
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app PhillyScan-Pro-Candidate-16-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhillyScan-Pro-Candidate-16-Simulator
          path: mobile/PhillyScan-Pro-Candidate-16-Simulator.zip
          retention-days: 14
