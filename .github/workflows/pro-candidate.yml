name: Free records candidate
on:
  push:
    branches: ['build/free-records-ai-18']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=PRO_PREVIEW=false
      - run: flutter test --dart-define=PRO_PREVIEW=true
      - name: Compile free records candidate
        run: flutter build ios --simulator --debug --build-name=1.1.0 --build-number=19 --dart-define-from-file=release-settings.json --dart-define=APP_ENV=prod --dart-define=PRO_PREVIEW=false --dart-define=INTERNAL_TESTING=false
      - name: Package simulator application
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app PhillyScan-Free-Records-19-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhillyScan-Free-Records-19-Simulator
          path: mobile/PhillyScan-Free-Records-19-Simulator.zip
          retention-days: 14
