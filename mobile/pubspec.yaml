name: philly_scan_app
description: Philly Scan – Property Facts & Insights
publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/finallogo.png

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/finallogo.png
  remove_alpha_ios: true
